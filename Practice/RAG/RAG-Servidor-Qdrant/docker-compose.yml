name: rag-qdrant

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG__LEVEL: "INFO"
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__STORAGE__DISK_THRESHOLD: "0.9"

volumes:
  qdrant_storage:
    driver: local
